<div class="modal" id="memberDetailsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Member Details</h5>
      </div>
      <div class="modal-body">
        <form [formGroup]="memberForm">
          <div class="form-floating mb-2">
            <input type="text" class="form-control" placeholder="" formControlName="firstName"
              maxlength="50"
              [class.is-invalid]="!memberForm.controls.firstName.valid">
            <label>First Name</label>
          </div>
          <div class="form-floating mb-2">
            <input type="text" class="form-control" placeholder="" formControlName="lastName"
              maxlength="50"
              [class.is-invalid]="!memberForm.controls.lastName.valid">
            <label>Last Name</label>
          </div>
          <div class="form-floating mb-2">
            <input type="email" class="form-control" placeholder="" formControlName="email"
              maxlength="75"
              [class.is-invalid]="!memberForm.controls.email.valid"
            >
            <label>Email Address</label>
          </div>
          <div class="form-floating">
            <input type="text" class="form-control" placeholder="" formControlName="phone"
              maxlength="20">
            <label>Phone Number</label>
          </div>
          <br/>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="chkAutoEnroll" formControlName="autoEnrollInNewRounds">
            <label class="form-check-label" for="chkAutoEnroll">
              Auto-enroll in new Rounds
            </label>
          </div>
          <br/>
          <div>
            <span class="me-2">Interest Tags: ({{ selectedtagCount }} selected)</span>
            <img src="/assets/icons/info-circle.svg" alt="Bootstrap" width="20" height="20"
              data-bs-toggle="tooltip"
              title="If starting a round with tags, then only members that match at least one tag will be invited to the round.">
            <br/>
            <br/>
            @for (item of tagSelectors; track item) {
              <span
                class="badge rounded-pill clickable-badge fw-normal fs-6 m-2"
                [ngClass]="{
                    'text-bg-primary': item.selected,
                    'text-bg-light': !item.selected
                  }"
              (click)="onClickTag(item)">{{ item.tagName }}</span>
            }
            <br/>
            <br/>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-primary bs-button me-2" (click)="onClickSave()" [disabled]="!memberForm.valid">Save Changes</button>
        <button class="btn btn-outline-danger  bs-button" (click)="onClickCancel()">Cancel Changes</button>
      </div>
    </div>
  </div>
</div>
